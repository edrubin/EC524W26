Handwritten digits are a useful .attn[machine-vision sandbox]:

.note[Bonus:] Connects .attn[unsup. learning], .attn[dim. reduction], .attn[image/multi-class pred].

name: kmeans

## *K*-means clustering

---
## The general idea

*K*-means is a simple clustering method groups our data into `\(K\)` groups:

- choose a number of .b.pink[clusters], *K*; .grey-vlight[*clusters* = groups of similar obs.]
- assign each observation to (exactly) one cluster `\(k\)`; .grey-vlight["nearest" cluster]
- summarize each cluster by its .b.pink[centroid]. .grey-vlight[center cluster's obs.]

*K*-means compresses a messy cloud into `\(\color{#e64173}{K}\)` .attn[representative centers].

--

Now we just need to an algorithm to find the .it[best] clustering...
&lt;br&gt;
which probably means defining .it[best] (.it[i.e.,] an .attn[objective function]).

---
## *K*-means: Objective function

Let cluster `\(k\)` have centroid `\(\mu_k\)`. .grey-vlight.it[(The mean location of its obs. in .slab[p] dim.)]

*K*-means chooses clusters `\(C_1, \ldots, C_K\)` to minimize .attn[within-cluster variation]

`$$\min_{C_1,\ldots,C_K} \sum_{k = 1}^K \sum_{i \in C_k} \lVert x_i - \mu_k \rVert^2$$`

.ex[E.g.,] .attn[within-cluster sum of squares (WCSS)] above.

Interpretation

- reward .hi-pink[tight, compact] clusters, .grey-vlight.it[(short distances add little to the sum)]
- "penalize" observations far from their centroids. .grey-vlight.it[(or "bad" clusters.)]

---
## *K*-means: Algorithm

A general algorithm for clustering:

1. pick `\(K\)` initial .pink[centroids]; .grey-vlight.it[(randomly, or with a heuristic)]
1. .pink[assign] each observation to its nearest centroid; .grey-vlight.it[(Euclidean distance)]
1. .pink[recompute] the centroids; .grey-vlight.it[(mean of the obs. in each cluster)]
1. .pink[repeat] until assignments stop changing. .grey-vlight.it[("convergence")]

  .b.orange[+]  Fast and intuitive.
&lt;br&gt;
  .b.purple[-]  Only guarantees (approx.) a local optimum.

---
## K-means on pixels

.ex[Recall:] Each image (obs.) is one point in .purple[784 dimensions].

There are .b.pink[10 labels]. `\(\color{#e64173}{K = 10}\)` seems like a natural first guess.

... however, `\(K = 10\)` is a guess; not a theorem.

.qa[Q:] Why might `\(K = 10\)` be a bad choice?



---
## Turning Clusters into Predictions

We have .b.orange[clusters]. .grey-vlight.it[(Groups of "close" images in pixel space.)]

We *want* .b.pink[predictions]. .grey-vlight.it[(Predicted digit labels.)]

- Cluster labels, *i.e.*, `\(1, 2, ..., K\)` are arbitrary. .grey-vlight.it[(they just index the clusters)]
- .note[Solution:] Relabel each cluster by its .attn[modal label]; .grey-vlight.it[(like RF: majority vote)]

.b[Result:] With `\(K = 10\)`, this classifier is approx. 54.2% accurate..super[.pink[†]]

.footnote[.pink[†] This measure of accuracy is still *in-sample*.]

--

.qa[Q].sub[1] Is this level of accuracy good?
&lt;br&gt;
.qa[Q].sub[2] What would random guessing get us?

## Why aren't we doing better?

What is it about the task—and our approach—that isn't working?

We may need more than 10 clusters to capture .b.purple[within-label variation]

- one .orange[label] can contain several .purple[handwriting styles];
- the same .orange[digit] can shift .purple[left, right, up, or down];
- strokes can be .purple[thicker, thinner, or slanted];
- some characters are .purple[quite ambiguous].

So Euclidean distance in raw pixel space is a rough measure of similarity.

## Elbows and clusters 

.qa[Q] What's the *elbow*?
&lt;br&gt;
.qa[A] The bendy part of the curve, of course!

- WCSS mechanically falls as `\(K\)` rises.
- We're looking for the point of .attn[diminishing marginal gains].
- .note[Caveat] If the bend is weak, the choice of `\(K\)` stays ambiguous.

.grey-light[Elbows are useful (subjective) heuristics—not *proper* decision rules.]

name: pca

## Now with PCA!

---
## PCA: Intuition

.attn[Principal component analysis (PCA)] is a .orange[dimension-reduction] method that finds new axes to summarize the data..super[.orange[†]]

Same data; different coordinates.

- The **first** PC explains the **most** variation...
- later PCs explain the most remaining *orthogonal* variation.
- We can use PCA to replace *many* pixel-based features with fewer .attn[linear combinations] of pixels..super[.pink[††]]

A relatively .orange[small subset] of PCs can give a compact summary of data.
&lt;br&gt;
`\(\implies\)` PCA *can* .b.orange[reduce dimensions] while .purple[preserving information]!

.footnote[
  .orange[†] PCA is applied in other contexts beyond dimension reduction.
  &lt;br&gt;
  .pink[††] Linear combinations of pixels are like "superpixels" that capture common patterns.
]

---
## PCA: A little math

The first principal component is

`$$Z_{1} = \phi_{1,1}X_{1} + \phi_{2,1}X_{2} + \cdots + \phi_{p,1}X_{p}$$`

with analogous definitions for the other `\(p-1\)` PCs `\(Z_2, Z_3, \ldots, Z_p\)`.

Don't be overwhelmed by the notation.
&lt;br&gt;Each PC is just a weighted combo. of the original features. .grey-vlight.it[(Just like OLS.)]

**Key ideas:**

- PCs are .pink[.b[linear combinations] of the original variables],
- PC.sub[i] is .b.purple[orthogonal] to all other PCs,.super[.purple[†]]
- we usually .b.slate[normalize] variables before PCA.

.footnote[.purple[†] Links: [Nice visualizations](https://setosa.io/ev/principal-component-analysis/) plus another [resource](https://www.nature.com/articles/nmeth.4346).]

---

class: clear, middle

**Updating our *K*-means workflow to include PCA**

1. .pink[normalize] the pixels,
1. keep enough PCs to .pink[explain 90% of variance],
1. .pink[run *K*-means] in the PC space.


``` r
# Define a simple PCA recipe
simple_recipe_pca =
  recipe(
    label ~ .,
    data =
      analysis_dt |&gt;
      select(label, starts_with('pixel'))
  ) |&gt;
  step_mutate(label = as.factor(label)) |&gt;
  step_normalize(all_numeric_predictors()) |&gt;
  step_pca(all_predictors(), threshold = .9) |&gt;
  step_rm(starts_with('pixel'))
```

## PCA: What is it good for?

So what does PCA do for us here? Subsetting to the PCs that represent 90% of the variance

- leaves us with .hi-orange[188 PCs], .grey-vlight.it[(≪ 784)]
- has .b.purple[45.1%] accuracy with `\(K = 10\)` clusters. .grey-vlight.it[(&lt; 54.2%)]
  
--

Wait. So... it's worse?

1. Yes, if we only consider .pink[*training* accuracy].
2. Maybe, if we consider the .orange[predictor space] was 24% of the original size.
3. TBD, if we actually check the .purple[test-set accuracy].
   
We have a more *compact* representation, but we *did* lose some information.

---
## What are we doing?

Let's think about what we're actually doing here.

- We are **still running *K*-means**.
- Only the .pink[coordinates] change with PCA.
- Comparable accuracy with far .purple[fewer dimensions] is a decent trade.

We *could* add more PCs. That road eventually leads to the original space.

--

What if we tried a .b.purple[nonlinear] dimension reduction method instead?

class: inverse, middle
name: umap

## UMAP .slate[No, *U*MAP!]

---
## UMAP: Intuition

.attn[UMAP].super.pink[†] is a popular .b.purple[nonlinear dimension-reduction method] that can capture more complex structures than PCA.

.footnote[.pink[†] UMAP stands for *Uniform Manifold Approximation and Projection*.&lt;br&gt;Examples [here](https://pair-code.github.io/understanding-umap/); paper's repo [here](https://github.com/lmcinnes/umap).]

- .b.purple[Start:] a high-dim. graph of the data—edges connect nearby obs.;
- .b.pink[Then:] optimized low-dim. graph that preserves local structure.
- .b.purple[Nonlinear:] can uncover *curved* structure that PCA misses.

--

The axes help with geometry—not direct interpretation

- strong for .hi-orange[visualization]; useful for .hi-orange[clustering];
- .b.slate[less interpretable] and more .b.slate[tuning-sensitive] than PCA.

---
layout: false
class: clear, middle

**Updating our *K*-means workflow to include UMAP**

1. .pink[normalize] the pixels
1. embed the data in .pink[.b[2] dimensions] via UMAP
1. cluster with .pink[*K*-means] in the embedded space
   

``` r
simple_recipe_umap =
  recipe(
    label ~ .,
    data = analysis_dt |&gt;
      select(label, starts_with('pixel'))
  ) |&gt;
  step_mutate(label = as.factor(label)) |&gt;
  step_normalize(all_numeric_predictors()) |&gt;
  step_umap(all_predictors(), num_comp = 2) |&gt;
  step_rm(starts_with('pixel'))
```

## K-means in the UMAP space

With only .attn[2 dimensions].grey-vlight[(!!)], *K*-means accuracy is .b.pink[64.6%] (*K*=10).

- This result *does not* mean UMAP always wins.
- It *does* mean a .b.purple[nonlinear embeddings] can preserve useful structures.
- UMAP's .b.purple[nonlinearity] can capture complex relationships.

Reading handwriting likely involves such complex/nonlinear relationships.

## Representation tradeoffs

What do these results mean?

- .hi-pink[Pixels] Simplest description, roughest geometry
- .hi-orange[PCA] Linear, compact, mathematically clean
- .hi-purple[UMAP] Nonlinear, visual, less interpretable

In-sample accuracy at `\(K = 10\)`

- .hi-pink[Pixels] 54.2%
- .hi-orange[PCA] 45.1%
- .hi-purple[UMAP] 64.6%

Representation choice can change clustering performance a lot.

---
## Structure and prediction

Unsupervised tools help depicts whether the features contain signal.

- they can reduce dimension before supervised learning,
- they can reveal where classes overlap

If the goal is prediction, we usually move back to .attn[supervised] methods.

.grey-vlight[(We could probably beat *K*-means with a more direct supervised method.)]

---
## Basic image-classification intuition

Our approach today for image classification

1. learn a good .attn[representation],
1. use that representation to make a prediction.

.note[Next step] Neural networks start learning both pieces together.

--

.note[Reminder] We have been treating the .b.purple[representation] as a .b[preprocessing step], but it is really part of the model. Cross validation should reflect that.

---
name: final-thoughts
## Final thoughts

What did we see?

- .b.pink[*K*-means] is simple; it depends heavily on geometry. &lt;br&gt;Other clustering methods have different assumptions and objectives.
- Raw, disjoint .b.pink[pixel space] is high-dimensional and awkward.&lt;br&gt;Convolutions and nonlinear embeddings can help.
- .hi-orange[PCA] gives a linear low-dimensional summary.&lt;br&gt;Reliance on linearity can be too restrictive.
- .hi-purple[UMAP] gives a nonlinear, low-dimensional summary.

.note[Next stop] Neural networks and a more serious classification pipeline.
